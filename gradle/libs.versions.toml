[versions]
agp = "9.2.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.9.4"
navigationCompose = "2.9.4"
activityCompose = "1.8.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
detekt = "1.23.8"
kotlinxSerializationJson = "1.9.0"
materialIconsExtended = "1.7.8"
workRuntimeKtx = "2.10.1"
playServicesLocation = "21.3.0"
playServicesMaps = "19.0.0"
mapsCompose = "6.4.1"
fragment = "1.8.9"
javascriptengine = "1.1.0"
material = "1.13.0"
glance = "1.1.1"
javamail = "1.6.7"
# Pinned to what `:app` already resolves to transitively (via lifecycle-runtime-ktx).
# `:plugin-sdk` needs it declared rather than inherited: a plugin app depends on the
# SDK alone and would otherwise have no coroutines at all.
coroutines = "1.9.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntimeKtx" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
play-services-maps = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "playServicesMaps" }
maps-compose = { group = "com.google.maps.android", name = "maps-compose", version.ref = "mapsCompose" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-javascriptengine = { group = "androidx.javascriptengine", name = "javascriptengine", version.ref = "javascriptengine" }
# Compose for app widgets. The home-screen surfaces are Glance, not Compose UI:
# a widget is RemoteViews under the hood and cannot host a Compose tree.
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
# Material Components (views), for the one screen that cannot be Compose: the
# dialog `OverlayPrompts` puts on screen from a background service.
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
# SMTP and IMAP, for the mail nodes. The Android port of JavaMail rather than the
# Jakarta-namespace org.eclipse.angus:jakarta.mail: Angus resolves its StreamProvider
# through ServiceLoader, which R8 strips and Android resource merging breaks, and
# which then fails as an exception on the first send rather than as a build error.
# This one finds its providers in plain META-INF resource files — see the packaging
# block in app/build.gradle.kts, which must never exclude them.
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
javamail-android = { group = "com.sun.mail", name = "android-mail", version.ref = "javamail" }
javamail-android-activation = { group = "com.sun.mail", name = "android-activation", version.ref = "javamail" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# `:plugin-sdk` — the AIDL and the plugin service base class have to be Android.
android-library = { id = "com.android.library", version.ref = "agp" }
# `:node-api` — a plain JVM library, deliberately not an android-library. Nothing
# under `core/` or `domain/` imports Android, so compiling the node declaration
# surface without `android.jar` on the classpath turns that convention into a
# compile error, and it runs plain JUnit with no AGP unit-test variant machinery.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

