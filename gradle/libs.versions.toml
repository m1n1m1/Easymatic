[versions]
agp = "9.2.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
lifecycleRuntimeKtx = "2.9.4"
navigationCompose = "2.9.4"
activityCompose = "1.8.0"
kotlin = "2.2.10"
composeBom = "2026.02.01"
detekt = "1.23.8"
kotlinxSerializationJson = "1.9.0"
materialIconsExtended = "1.7.8"
workRuntimeKtx = "2.10.1"
playServicesLocation = "21.3.0"
playServicesMaps = "19.0.0"
mapsCompose = "6.4.1"
fragment = "1.8.9"
javascriptengine = "1.1.0"
material = "1.13.0"
glance = "1.1.1"
javamail = "1.6.7"
exifinterface = "1.4.1"
okhttp = "4.12.0"
paho = "1.2.5"
mlkitGenAiPrompt = "1.0.0-beta2"
mlkitTranslate = "17.0.3"
mlkitLanguageId = "17.0.6"
# Pinned to what `:app` already resolves to transitively (via lifecycle-runtime-ktx).
# `:plugin-sdk` needs it declared rather than inherited: a plugin app depends on the
# SDK alone and would otherwise have no coroutines at all.
coroutines = "1.9.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended", version.ref = "materialIconsExtended" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerializationJson" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workRuntimeKtx" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "playServicesLocation" }
play-services-maps = { group = "com.google.android.gms", name = "play-services-maps", version.ref = "playServicesMaps" }
maps-compose = { group = "com.google.maps.android", name = "maps-compose", version.ref = "mapsCompose" }
androidx-fragment = { group = "androidx.fragment", name = "fragment", version.ref = "fragment" }
androidx-javascriptengine = { group = "androidx.javascriptengine", name = "javascriptengine", version.ref = "javascriptengine" }
# Compose for app widgets. The home-screen surfaces are Glance, not Compose UI:
# a widget is RemoteViews under the hood and cannot host a Compose tree.
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-glance-material3 = { group = "androidx.glance", name = "glance-material3", version.ref = "glance" }
# Material Components (views), for the one screen that cannot be Compose: the
# dialog `OverlayPrompts` puts on screen from a background service.
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
# SMTP and IMAP, for the mail nodes. The Android port of JavaMail rather than the
# Jakarta-namespace org.eclipse.angus:jakarta.mail: Angus resolves its StreamProvider
# through ServiceLoader, which R8 strips and Android resource merging breaks, and
# which then fails as an exception on the first send rather than as a build error.
# This one finds its providers in plain META-INF resource files — see the packaging
# block in app/build.gradle.kts, which must never exclude them.
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
javamail-android = { group = "com.sun.mail", name = "android-mail", version.ref = "javamail" }
# The one WebSocket, for Home Assistant's push channel. Deliberately the exception to
# this project's rule that networking is hand-rolled on `HttpURLConnection` —
# `HueTransport` and `AiTransport` both are, and both stay that way. What is different
# here is that a WebSocket is not one connection call: it is RFC 6455 framing, masking,
# continuation frames, ping/pong liveness and reconnect backoff, none of which the JDK
# offers below Java 11's `HttpClient` (API 34 on Android, where minSdk is 26). Written
# by hand that is a few hundred lines whose bugs surface as a socket that silently
# stops delivering — the failure shape this integration exists to avoid.
# 4.12.0 rather than 5.x: it is the last line still targeting Java 8, so it needs no
# desugaring at minSdk 26.
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
# MQTT, for the broker nodes. The second dependency taken on the websocket's argument
# rather than on `HueTransport`'s: MQTT is not a request shape over a socket, it is a
# framing — a variable-length remaining-length integer, packet identifiers, the QoS 1
# and 2 acknowledgement flows, `PINGREQ` keepalive, session state and reconnect
# backoff. Hand-rolled, its bugs surface as a connection that stays open and silently
# stops delivering, which is precisely the failure a trigger cannot report.
#
# The *Java* client, not `org.eclipse.paho.android.service`. That wrapper is deprecated
# and exists to own a background Service, which this app already has one of — so what
# is taken here is the plain, dependency-free protocol implementation: roughly 250 KB
# of dex, no transitive dependencies at all, and Java 8, so it needs no desugaring at
# minSdk 26.
paho-mqtt = { group = "org.eclipse.paho", name = "org.eclipse.paho.client.mqttv3", version.ref = "paho" }
javamail-android-activation = { group = "com.sun.mail", name = "android-activation", version.ref = "javamail" }
# Reading and writing a photo's EXIF, for `action.image_info` and
# `action.image_metadata`. The framework `android.media.ExifInterface` is not a
# substitute at minSdk 26, and the reason is the failure shape this project refuses
# everywhere else rather than a feature count: it writes **JPEG only**, and its TAG_*
# constants arrived piecemeal across API 24 to 31, so a tag that reads correctly on a
# modern phone returns null on an older one — silently, with no error and no way for a
# macro to tell "this photo has no camera model" from "this Android cannot read one".
# The AndroidX copy backports the whole tag set, reads PNG/WebP/HEIF/DNG/RAW, writes
# JPEG/PNG/WebP, and owns the seekable-descriptor requirement `saveAttributes` has. It
# is ~150 KB of dex with no transitive dependencies, and it is the trade already taken
# for okhttp and paho: one library instead of a version branch whose rarely-taken half
# is the broken one.
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifinterface" }
# On-device generative AI, for the `ML_KIT` provider. The one dependency here that is
# not a network client at all, which is also why it is not hand-rolled the way
# `AiTransport` and `HueTransport` are: there is no wire to write. It is an AIDL
# binding to AICore, the Android system service that owns Gemini Nano, and the model
# weights, their download and their versioning all live outside the app. Written by
# hand that is not a few hundred lines of framing but a private system interface with
# no published contract.
#
# It is **beta**, and the only non-GA artifact in this list. The exposure is bounded by
# where it is reachable from: one `OnDeviceAi` implementation behind `RoutingAi`, whose
# every failure mode already falls back to a cloud profile or reports a sentence, so a
# breaking change in the SDK cannot reach a node.
mlkit-genai-prompt = { group = "com.google.mlkit", name = "genai-prompt", version.ref = "mlkitGenAiPrompt" }
# On-device translation and language identification, for `action.translate`. Both are
# GA, so neither carries the caveat above — that sentence is about `genai-prompt` and
# stays true: it is still the only non-GA artifact here.
#
# They are not network clients either, and for a different reason from `genai-prompt`:
# the inference runs in-process from a bundled library rather than over AIDL to a system
# service, so there is nothing to hand-roll and nothing to hand-roll it against. The
# per-language model files are the one part that is fetched, and the SDK owns that —
# which is why `MlKitTranslation` can offer a Wi-Fi-only download as a flag rather than
# as a downloader of its own.
#
# `language-id` is a separate artifact because it is a separate model, and it is the
# smaller half: its model ships *inside* the AAR, so identification works on a phone
# that has never downloaded anything.
mlkit-translate = { group = "com.google.mlkit", name = "translate", version.ref = "mlkitTranslate" }
mlkit-language-id = { group = "com.google.mlkit", name = "language-id", version.ref = "mlkitLanguageId" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# `:plugin-sdk` — the AIDL and the plugin service base class have to be Android.
android-library = { id = "com.android.library", version.ref = "agp" }
# `:node-api` — a plain JVM library, deliberately not an android-library. Nothing
# under `core/` or `domain/` imports Android, so compiling the node declaration
# surface without `android.jar` on the classpath turns that convention into a
# compile error, and it runs plain JUnit with no AGP unit-test variant machinery.
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }

