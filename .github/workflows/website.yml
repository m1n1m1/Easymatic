name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '.github/workflows/website.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: website

jobs:
  build:
    name: Build (no deploy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full checkout: scripts/generate-node-pages.mjs resolves
      # ../docs/nodes.generated.json relative to process.cwd() (= website/) and
      # hard-fails if it is missing. docs/ is in the path filter for the same reason.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # defaults.run.working-directory does not apply to `uses:` inputs,
          # so these paths are repo-relative.
          node-version-file: website/.node-version
          cache: npm
          cache-dependency-path: website/package-lock.json

      - run: npm ci

      # `build` is tokens -> astro build. The node reference is generated by
      # astro.config.mjs itself, so it cannot be skipped by invoking astro directly —
      # which is what Cloudflare Workers Builds does (`npx astro build`) and what used to
      # fail there on every pull request while this job passed.
      - run: npm run build

      # tokens.css is generated by `npm run tokens` (already run above by `build`) and
      # is committed. It is the only tracked generated artifact under website/, and
      # unlike nodes.generated.json and strings_nodes.xml it had no guard at all.
      - name: Fail if committed design tokens are stale
        run: git diff --exit-code -- src/styles/tokens.css
