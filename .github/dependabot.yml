version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci

  # Reads gradle/libs.versions.toml natively. Grouped so a Compose BOM or AndroidX
  # bump arrives as one PR rather than a dozen. The build carries one non-GA
  # dependency (mlkit-genai-prompt 1.0.0-beta2) worth watching.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      androidx:
        patterns: ['androidx.*']
      kotlin:
        patterns: ['org.jetbrains.kotlin*']

  - package-ecosystem: npm
    directory: /website
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      astro:
        patterns: ['astro', '@astrojs/*']
    ignore:
      # TypeScript majors are gated on @astrojs/check, which peers on
      # `^5.0.0 || ^6.0.0` as of its latest release (0.9.10). A major bump here is
      # therefore not a bump this repo can take or fix — `npm ci` fails ERESOLVE at
      # install, so the PR cannot even reach a build. Minors and patches still come
      # through. Drop this entry the day @astrojs/check widens the peer range.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
