config:
  validation: true
  warningsAsErrors: false

naming:
  FunctionNaming:
    active: true
    ignoreAnnotated: ['Composable', 'Preview']

complexity:
  active: true
  LongMethod:
    ignoreAnnotated: ['Composable', 'Preview']
  LongParameterList:
    ignoreAnnotated: ['Composable', 'Preview']

style:
  MagicNumber:
    ignoreAnnotated: ['Composable', 'Preview']
    ignorePropertyDeclaration: true

potential-bugs:
  active: true
